[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grafos_fcd"
version = "0.1.0"
description = "Validação Tecnológica: Bases de Dados em Grafos (Neo4j & Cypher) aplicada à Matriz Curricular de TADS/UFRN"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pedro Davi" },
    { name = "Cleiton Mizael" },
    { name = "Natanael Lucas" }
]
license = { text = "MIT" }
dependencies = [
    "neo4j>=5.18.0",
    "pandas>=2.2.0",
    "networkx>=3.2.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "jupyterlab>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

